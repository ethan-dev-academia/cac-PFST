<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Pasco Flood Map</title>
<link href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.css" rel="stylesheet">
<style>
  :root { --bg: #f2f2f7; --surface: rgba(255,255,255,.96); --label: #1c1c1e; --label2: #5f6368; --sep: rgba(60,60,67,.16); --tint: #007aff; --bad: #ff3b30; }
  body.dark { --bg: #000; --surface: rgba(28,28,30,.96); --label: #f5f5f7; --label2: #aeaeb2; --sep: rgba(84,84,88,.55); --tint: #0a84ff; --bad: #ff453a; }
  html, body, #map { margin: 0; height: 100%; background: var(--bg); color: var(--label);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .card { background: var(--surface); border-radius: 12px; box-shadow: 0 4px 18px rgba(0,0,0,.14); }
  #legend { position: absolute; left: 12px; bottom: 24px; padding: 10px 12px; font-size: 12px; color: var(--label2); min-width: 200px; display: none; }
  #legend b { color: var(--label); font-weight: 600; }
  #legend .bar { height: 8px; border-radius: 4px; margin: 7px 0 4px; background: linear-gradient(90deg, rgba(165,230,255,.6), #60c4ff 15%, #2684ff 30%, #1850dc 45%, #341eaa 70%, #5a0a78); }
  #legend .ticks { display: flex; justify-content: space-between; font-size: 11px; }
  .maplibregl-popup-content { background: var(--surface); color: var(--label); border-radius: 12px; box-shadow: 0 6px 24px rgba(0,0,0,.18); font: 13px/1.4 inherit; padding: 10px 12px; }
  .maplibregl-popup-content .sub { color: var(--label2); }
  .maplibregl-popup-tip { display: none; }
  .hov .maplibregl-popup-content { pointer-events: none; }
  #classes { display: none !important; }
  .maplibregl-ctrl-attrib { background: transparent !important; color: var(--label2); font-size: 10px; }
  .maplibregl-ctrl-attrib a { color: var(--label2); }
  .maplibregl-ctrl-group { background: var(--surface) !important; border-radius: 10px !important; box-shadow: 0 2px 8px rgba(0,0,0,.15) !important; }
  #player { position: absolute; left: 50%; transform: translateX(-50%); bottom: 24px; display: none; align-items: center; gap: 12px;
    padding: 10px 14px; width: min(520px, calc(100% - 140px)); z-index: 5; }
  #player button { all: unset; cursor: pointer; width: 34px; height: 34px; border-radius: 50%; background: var(--tint); color: #fff;
    display: grid; place-items: center; font-size: 12px; flex: none; }
  #player .pmain { flex: 1; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  #player .prow { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--label2); white-space: nowrap; }
  #player .prow #ptime { color: var(--label); font-weight: 600; }
  #player input { width: 100%; accent-color: var(--tint); margin: 0; }
  @media (max-width: 760px) { #player { width: calc(100% - 24px); bottom: 16px; } #legend { display: none !important; } }
  .pin { width: 20px; height: 20px; border-radius: 50%; background: var(--bad); border: 3px solid #fff; box-shadow: 0 2px 8px rgba(0,0,0,.35); animation: pulse 2s ease-out infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255,59,48,.5), 0 2px 8px rgba(0,0,0,.35);} 100% { box-shadow: 0 0 0 18px rgba(255,59,48,0), 0 2px 8px rgba(0,0,0,.35);} }
</style>
</head>
<body>
<div id="map"></div>
<div id="classes" class="glass">
  <div><i style="background:rgba(76,195,255,.6)"></i>Coastal low-lying</div>
  <div><i style="background:rgba(64,110,255,.6)"></i>Low-lying inland</div>
  <div><i style="background:rgba(150,190,140,.35)"></i>Higher ground</div>
</div>
<div id="player" class="card">
  <button id="pbtn" aria-label="Play the storm">&#9654;</button>
  <div class="pmain"><div class="prow"><span id="ptime">Peak of the storm</span><span id="pcount"></span></div>
    <input id="pslider" type="range" min="0" max="1" value="1" aria-label="Storm time"></div>
</div>
<div id="legend" class="card"><b>Deepest water</b><div class="bar"></div>
  <div class="ticks"><span>2 in</span><span>6 in</span><span>1 ft</span><span>2 ft</span><span>3 ft+</span></div></div>
<script src="common.js"></script>
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<script>
const ORG = "https://services6.arcgis.com/Mo4MddfRHpFwT7UF/ArcGIS/rest/services";
const S = { tiles: [], tile: null, corners: null, result: null, edits: [], marker: null, depth: null };

const map = new maplibregl.Map({
  container: "map", center: [-82.70, 28.30], zoom: 10.4, pitch: 0, bearing: 0, maxPitch: 70,
  attributionControl: { compact: true },
  style: {
    version: 8, glyphs: "https://demotiles.maplibre.org/font/{fontstack}/{range}.pbf",
    sources: {
      light: { type: "raster", tileSize: 256, maxzoom: 16, tiles: ["https://services.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}"], attribution: "Esri, HERE, Garmin, © OpenStreetMap" },
      lightref: { type: "raster", tileSize: 256, maxzoom: 16, tiles: ["https://services.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Reference/MapServer/tile/{z}/{y}/{x}"] },
      darkst: { type: "raster", tileSize: 256, maxzoom: 16, tiles: ["https://services.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}"], attribution: "Esri, HERE, Garmin, © OpenStreetMap" },
      darkref: { type: "raster", tileSize: 256, maxzoom: 16, tiles: ["https://services.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}"] },
      sat: { type: "raster", tileSize: 256, maxzoom: 19,
             tiles: ["https://services.arcgisonline.com/arcgis/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"],
             attribution: "Imagery © Esri, Maxar, Earthstar" },
      labels: { type: "raster", tileSize: 256,
             tiles: ["https://services.arcgisonline.com/arcgis/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}"] },
      dem: { type: "raster-dem", encoding: "terrarium", tileSize: 256, maxzoom: 15,
             tiles: ["https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png"], attribution: "Terrain: AWS Terrain Tiles" },
      fema: { type: "raster", tileSize: 256,
             tiles: ["https://hazards.fema.gov/arcgis/rest/services/public/NFHL/MapServer/export?bbox={bbox-epsg-3857}&bboxSR=3857&imageSR=3857&size=256,256&format=png32&transparent=true&layers=show:28&f=image"],
             attribution: "FEMA NFHL" },
    },
    layers: [
      { id: "light", type: "raster", source: "light" },
      { id: "darkst", type: "raster", source: "darkst", layout: { visibility: "none" } },
      { id: "sat", type: "raster", source: "sat", layout: { visibility: "none" } },
      { id: "fema", type: "raster", source: "fema", layout: { visibility: "none" }, paint: { "raster-opacity": 0.5 } },
      { id: "labels", type: "raster", source: "labels", layout: { visibility: "none" }, paint: { "raster-opacity": 0.9 } },
      { id: "lightref", type: "raster", source: "lightref" },
      { id: "darkref", type: "raster", source: "darkref", layout: { visibility: "none" } },
    ],
  },
});
map.on("error", (e) => console.warn("map error", e.error?.message || e));
if (innerWidth > 760) map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), "bottom-right");


const empty = { type: "FeatureCollection", features: [] };
map.on("load", async () => {
  applyTheme();
  map.addSource("grid", { type: "geojson", data: empty });
  map.addSource("sel", { type: "geojson", data: empty });
  map.addSource("observed", { type: "geojson", data: empty });
  map.addSource("swfwmd", { type: "geojson", data: empty });
  map.addSource("buildings", { type: "geojson", data: empty });
  map.addSource("edits", { type: "geojson", data: empty });
  map.addLayer({ id: "swfwmd", type: "fill", source: "swfwmd", layout: { visibility: "none" },
                 paint: { "fill-color": "#ffd166", "fill-opacity": 0.22, "fill-outline-color": "#ffd166" } });
  map.addLayer({ id: "observed", type: "fill", source: "observed", layout: { visibility: "none" },
                 paint: { "fill-color": "#ff5468", "fill-opacity": 0.28 } });
  map.addLayer({ id: "observed-line", type: "line", source: "observed", layout: { visibility: "none" },
                 paint: { "line-color": "#ff8a98", "line-width": 1.2 } });
  // every tile in the county is drawn and classified: nothing on land is blank
  const CLS_FILL = ["match", ["get", "cls"], "coastal", "rgba(0,122,255,0.16)", "low", "rgba(88,86,214,0.13)",
                    "higher", "rgba(52,199,89,0.04)", "rgba(0,0,0,0)"];
  const CLS_LINE = ["match", ["get", "cls"], "coastal", "rgba(0,122,255,0.35)", "low", "rgba(88,86,214,0.30)",
                    "higher", "rgba(120,120,128,0.18)", "rgba(0,0,0,0)"];
  map.addLayer({ id: "grid-fill", type: "fill", source: "grid", paint: { "fill-color": CLS_FILL } });
  map.addLayer({ id: "grid-line", type: "line", source: "grid", paint: { "line-color": CLS_LINE, "line-width": 0.6 } });
  map.addLayer({ id: "grid-hover", type: "line", source: "grid", filter: ["==", ["get", "id"], ""],
                 paint: { "line-color": "#ffffff", "line-width": 1.6, "line-opacity": 0.8 } });
  map.addLayer({ id: "sel-line", type: "line", source: "sel",
                 paint: { "line-color": ["case", ["boolean", ["get", "dark"], false], "#ffffff", "#1c1c1e"], "line-width": 2, "line-dasharray": [2, 1.2] } });
  map.addLayer({ id: "buildings", type: "fill-extrusion", source: "buildings", minzoom: 13,
                 paint: { "fill-extrusion-color": ["case", [">", ["get", "d"], 0.3048], "#ff5468", [">", ["get", "d"], 0.05], "#ffb547", "#e9eef7"],
                          "fill-extrusion-height": ["case", [">", ["get", "d"], 0.3048], 9, 6],
                          "fill-extrusion-opacity": 0.92 } });
  map.addLayer({ id: "edits-fill", type: "fill", source: "edits", filter: ["==", ["geometry-type"], "Polygon"],
                 paint: { "fill-color": "#3ee6a8", "fill-opacity": 0.35 } });
  map.addLayer({ id: "edits-line", type: "line", source: "edits",
                 paint: { "line-color": "#3ee6a8", "line-width": ["case", ["==", ["geometry-type"], "LineString"], 6, 2] } });

  PF.getJSON("/grid").then((g) => map.getSource("grid").setData(g)).catch((e) => console.warn(e));
  // street names stay readable above the flood overlay
  ["labels", "lightref", "darkref"].forEach((id) => map.moveLayer(id, "buildings"));
  // countywide observed-flooding polygons straight from the county service (small layer)
  fetch(`${ORG}/PascoMapper_Storm/FeatureServer/6/query?where=1%3D1&outFields=*&outSR=4326&f=geojson`)
    .then((r) => r.json()).then((g) => map.getSource("observed").setData(g)).catch(() => {});
  PF.send({ type: "ready", view: "map" });
  const t = PF.params.get("tile"); if (t) await selectTile(t, true);
  const rk = PF.params.get("result"); if (rk) showResult(rk).catch(() => {});
});

// one in-flight tile load at a time; results wait for it so they never draw on stale corners
S.loading = Promise.resolve();
function selectTile(tid, fly = true) {
  S.loading = S.loading.then(() => doSelectTile(tid, fly)).catch((e) => console.warn(e));
  return S.loading;
}
async function doSelectTile(tid, fly) {
  if (!tid) {  // deselect
    S.tile = null; S.corners = null; S.result = null; S.depth = null; clearOverlay();
    map.getSource("sel").setData(empty); map.getSource("buildings").setData(empty); return;
  }
  if (S.tile !== tid || !S.corners) {
    S.tile = tid; S.result = null; S.depth = null; S.bfc = null; clearOverlay();
    const meta = await PF.getJSON(`/tiles/${tid}?light=true`);
    S.corners = meta.corners;
    map.getSource("sel").setData({ type: "Feature", properties: {}, geometry: { type: "Polygon", coordinates: [[...S.corners, S.corners[0]]] } });
    PF.getJSON(`/tiles/${tid}/buildings`).then((g) => { if (S.tile === tid) { S.bfc = g; colorBuildings(S.curDepth); } }).catch(() => {});
    PF.getJSON(`/tiles/${tid}/layers/swfwmd_100yr`).then((g) => map.getSource("swfwmd").setData(g)).catch(() => {});
  }
  if (fly && S.corners) {
    const lons = S.corners.map((c) => c[0]), lats = S.corners.map((c) => c[1]);
    map.fitBounds([[Math.min(...lons), Math.min(...lats)], [Math.max(...lons), Math.max(...lats)]],
                  { padding: padding(), pitch: 35, bearing: 0, duration: 1800 });
  }
  drawEdits();
}

function padding() {
  if (S.pad) return S.pad;
  const w = innerWidth, h = innerHeight, wide = w > 760;
  return wide ? { top: 70, bottom: 40, left: 40, right: 70 }
              : { top: Math.min(80, h * 0.12), bottom: Math.min(300, h * 0.42), left: 20, right: 20 };
}
function clearOverlay() {
  stopPlay();
  if (map.getLayer("depth")) map.removeLayer("depth");
  if (map.getSource("depth")) map.removeSource("depth");
  document.getElementById("legend").style.display = "none";
  document.getElementById("player").style.display = "none";
  if (map.getLayer("grid-fill")) map.setPaintProperty("grid-fill", "fill-opacity", 1);
}
function colorBuildings(depth) {
  if (depth) S.curDepth = depth;
  if (!S.bfc) return 0;
  const d = depth || S.depth;
  let wet = 0;
  S.bfc.features.forEach((f) => { const v = d ? d[f.properties.k] : 0; f.properties.d = v; if (v > PF.FT) wet++; });
  map.getSource("buildings").setData(S.bfc);
  return wet;
}

// ---- water rendering: drawn here (not a server PNG) so it can animate, and smoothed so it reads as water
const LUT = (() => {                       // depth (0..2.5 m in 256 steps) -> RGBA, alpha ramps in from ~2 cm
  const out = new Uint8ClampedArray(256 * 4);
  for (let i = 0; i < 256; i++) {
    const h = (i / 255) * 2.5, c = PF.depthColor(h);
    const a = h < 0.02 ? 0 : Math.min(235, 70 + 165 * Math.min(1, h / 0.9)) * Math.min(1, (h - 0.02) / 0.06);
    out.set([c[0], c[1], c[2], a], i * 4);
  }
  return out;
})();
function paintWater(depth) {
  const small = S.small || (S.small = Object.assign(document.createElement("canvas"), { width: PF.N, height: PF.N }));
  const sctx = small.getContext("2d");
  const img = sctx.createImageData(PF.N, PF.N);
  for (let k = 0; k < depth.length; k++) {
    const i = Math.min(255, Math.max(0, Math.round((depth[k] / 2.5) * 255))) * 4;
    img.data[k * 4] = LUT[i]; img.data[k * 4 + 1] = LUT[i + 1]; img.data[k * 4 + 2] = LUT[i + 2]; img.data[k * 4 + 3] = LUT[i + 3];
  }
  sctx.putImageData(img, 0, 0);
  let cv = document.getElementById("depthcv");
  if (!cv) { cv = document.createElement("canvas"); cv.id = "depthcv"; cv.width = cv.height = 768; cv.style.display = "none"; document.body.appendChild(cv); }
  const ctx = cv.getContext("2d");
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = "high";
  ctx.drawImage(small, 0, 0, cv.width, cv.height);
}
function ensureDepthLayer() {
  if (map.getSource("depth")) return;
  // canvas source; never set "raster-resampling: nearest" on it (renders black in MapLibre 5.24)
  map.addSource("depth", { type: "canvas", canvas: "depthcv", coordinates: S.corners, animate: true });
  map.addLayer({ id: "depth", type: "raster", source: "depth", paint: { "raster-opacity": 0, "raster-opacity-transition": { duration: 900 } } }, "buildings");
  requestAnimationFrame(() => map.setPaintProperty("depth", "raster-opacity", 0.92));
}

// ---- playback: the storm hour by hour, buildings change colour as the water reaches them
let playTimer = null;
function stopPlay() { if (playTimer) { clearInterval(playTimer); playTimer = null; } setPlayIcon(false); }
function setPlayIcon(on) { const b = document.getElementById("pbtn"); if (b) b.innerHTML = on ? "&#10074;&#10074;" : "&#9654;"; }
function showFrame(i) {
  const fr = S.frames, last = i >= fr.length;
  const depth = last ? S.depth : fr[i];
  paintWater(depth);
  const wet = colorBuildings(depth);
  document.getElementById("pslider").value = String(Math.min(i, fr.length));
  document.getElementById("ptime").textContent = last ? "Peak of the storm" : `Hour ${Math.round(S.frameT[i])} of the storm`;
  document.getElementById("pcount").textContent = `${wet} home${wet === 1 ? "" : "s"} with 1 ft+ of water`;
  S.frameIdx = i;
}
function play(fromStart = true) {
  if (!S.frames || !S.frames.length) return;
  stopPlay();
  let i = fromStart || S.frameIdx >= S.frames.length ? 0 : S.frameIdx;
  setPlayIcon(true);
  playTimer = setInterval(() => {
    showFrame(i);
    if (i >= S.frames.length) { stopPlay(); PF.send({ type: "playDone" }); return; }
    i++;
  }, 170);
}

let showSeq = 0;
async function showResult(key, autoplay = true) {
  const my = ++showSeq;   // overlapping calls (app re-posts on "ready"): only the latest one draws
  const r = await PF.getJSON(`/jobs/${key}`);
  if (my !== showSeq || r.status !== "done") return;
  if (r.tile_id !== S.tile) selectTile(r.tile_id, true);
  await S.loading;
  if (my !== showSeq || r.tile_id !== S.tile) return;
  clearOverlay();
  S.result = r; S.depth = PF.mm(r.grids.mean);
  S.frames = r.frames ? r.frames.grids.map(PF.mm) : null; S.frameT = r.frames ? r.frames.t_h : [];
  S.frameIdx = S.frames ? S.frames.length : 0;
  paintWater(S.frames && autoplay ? S.frames[0] : S.depth);
  ensureDepthLayer();
  document.getElementById("legend").style.display = "block";
  map.setPaintProperty("grid-fill", "fill-opacity", 0.12);   // don't tint the flood depths
  S.edits = r.scenario.edits || S.edits; drawEdits();
  if (S.frames && S.frames.length) {
    const sl = document.getElementById("pslider"); sl.max = String(S.frames.length);
    document.getElementById("player").style.display = "flex";
    if (autoplay) setTimeout(() => my === showSeq && play(true), 700); else showFrame(S.frames.length);
  } else {
    colorBuildings();
  }
}

function circle(center, radiusCells) {
  const pts = [];
  for (let a = 0; a <= 48; a++) pts.push(PF.cellToLonLat(S.corners, center[0] + radiusCells * Math.sin(a / 48 * 2 * Math.PI), center[1] + radiusCells * Math.cos(a / 48 * 2 * Math.PI)));
  return pts;
}
function drawEdits() {
  if (!map.getSource("edits") || !S.corners) return;
  const feats = [];
  for (const e of S.edits) {
    if (e.type === "pond" && e.center) feats.push({ type: "Feature", properties: {}, geometry: { type: "Polygon", coordinates: [circle(e.center, (e.radius_m || 40) / 10)] } });
    if (e.type === "road" && e.path?.length > 1) feats.push({ type: "Feature", properties: {}, geometry: { type: "LineString", coordinates: e.path.map(([r, c]) => PF.cellToLonLat(S.corners, r, c)) } });
    if (e.type === "culvert" && e.a && e.b) feats.push({ type: "Feature", properties: {}, geometry: { type: "LineString", coordinates: [e.a, e.b].map(([r, c]) => PF.cellToLonLat(S.corners, r, c)) } });
  }
  map.getSource("edits").setData({ type: "FeatureCollection", features: feats });
}

map.on("click", (e) => {
  const { lng, lat } = e.lngLat;
  if (S.corners) {
    const [r, c] = PF.lonLatToCell(S.corners, lng, lat);
    if (r >= -0.5 && r < 127.5 && c >= -0.5 && c < 127.5) {
      const rr = Math.round(r), cc = Math.round(c), k = rr * 128 + cc;
      const info = { type: "tap", cell: [rr, cc], lonlat: [lng, lat] };
      if (S.result) {
        const g = S.result.grids; info.mean_ft = +(PF.mm(g.mean)[k] / PF.FT).toFixed(2);
        info.p10_ft = +(PF.mm(g.p10)[k] / PF.FT).toFixed(2); info.p90_ft = +(PF.mm(g.p90)[k] / PF.FT).toFixed(2);
        new maplibregl.Popup({ closeButton: false, offset: 12 }).setLngLat(e.lngLat)
          .setHTML(info.mean_ft < 0.1 ? `<b>Stays dry</b>` : `<b style="font-size:15px">${info.mean_ft.toFixed(1)} ft</b> of water<br><span class="sub">likely ${info.p10_ft.toFixed(1)}–${info.p90_ft.toFixed(1)} ft</span>`).addTo(map);
      }
      PF.send(info); return;
    }
  }
  const f = map.queryRenderedFeatures(e.point, { layers: ["grid-fill"] })[0];
  PF.send({ type: "tapOutside", lonlat: [lng, lat], cls: f ? f.properties.cls : "outside" });
});
// hover card for the county grid (desktop)
const hover = new maplibregl.Popup({ closeButton: false, closeOnClick: false, offset: 14, className: "hov" });
const CLS_TXT = { coastal: "Low-lying coast", low: "Low-lying ground", higher: "Higher ground", water: "Open water" };
map.on("mousemove", "grid-fill", (e) => {
  const p = e.features[0].properties;
  map.getCanvas().style.cursor = "pointer";
  map.setFilter("grid-hover", ["==", ["get", "id"], p.id]);
  const z10 = p.z10 != null && p.z10 !== "null" ? " · low ground " + (p.z10 / 0.3048).toFixed(0) + " ft" : "";
  hover.setLngLat(e.lngLat).setHTML("<b>" + (CLS_TXT[p.cls] || p.cls) + "</b><br><span class='sub'>"
    + (+p.b || 0).toLocaleString() + " buildings · click to check this area</span>").addTo(map);
});
map.on("mouseleave", "grid-fill", () => { map.getCanvas().style.cursor = ""; map.setFilter("grid-hover", ["==", ["get", "id"], ""]); hover.remove(); });

const LAYER_IDS = { fema: ["fema"], observed: ["observed", "observed-line"], swfwmd: ["swfwmd"], buildings: ["buildings"], grid: ["grid-fill", "grid-line"] };
document.getElementById("pbtn").onclick = () => (playTimer ? stopPlay() : play(S.frameIdx >= (S.frames || []).length));
document.getElementById("pslider").oninput = (e) => { stopPlay(); showFrame(+e.target.value); };
// appearance + basemap, driven by the app
S.dark = false; S.style = "streets";
function applyTheme() {
  document.body.classList.toggle("dark", S.dark);
  if (!map.getLayer("light")) return;
  const sat = S.style === "satellite";
  map.setLayoutProperty("light", "visibility", !sat && !S.dark ? "visible" : "none");
  map.setLayoutProperty("darkst", "visibility", !sat && S.dark ? "visible" : "none");
  map.setLayoutProperty("sat", "visibility", sat ? "visible" : "none");
  map.setLayoutProperty("labels", "visibility", sat ? "visible" : "none");
  map.setLayoutProperty("lightref", "visibility", !sat && !S.dark ? "visible" : "none");
  map.setLayoutProperty("darkref", "visibility", !sat && S.dark ? "visible" : "none");
  map.setTerrain(sat ? { source: "dem", exaggeration: 3 } : null);
  if (map.getLayer("sel-line")) map.setPaintProperty("sel-line", "line-color", S.dark || sat ? "#ffffff" : "#1c1c1e");
  if (map.getLayer("buildings")) map.setPaintProperty("buildings", "fill-extrusion-color",
    ["case", [">", ["get", "d"], 0.3048], "#ff3b30", [">", ["get", "d"], 0.05], "#ff9f0a", S.dark || sat ? "#d1d1d6" : "#c7c7cc"]);
}
// messages can arrive before the style has loaded; queue them until then
let styleReady = false;
const pending = [];
map.on("load", () => { styleReady = true; setTimeout(() => pending.splice(0).forEach(handle), 0); });
PF.onMessage((m) => (styleReady ? handle(m) : pending.push(m)));
async function handle(m) {
  if (m.type === "theme") { S.dark = !!m.dark; S.style = m.style || "streets"; applyTheme(); }
  if (m.type === "load") selectTile(m.tile_id || null, m.fly !== false);
  if (m.type === "flyTo" && m.lonlat) map.flyTo({ center: m.lonlat, zoom: m.zoom || 15.5, pitch: 40, duration: 1800, essential: true, padding: padding() });
  if (m.type === "home") map.flyTo({ center: [-82.70, 28.30], zoom: 10.4, pitch: 0, bearing: 0, duration: 1600 });
  if (m.type === "padding") { S.pad = m.pad; }
  if (m.type === "result" && m.key) showResult(m.key, m.autoplay !== false);
  if (m.type === "play") play(true);
  if (m.type === "clear") { S.result = null; S.depth = null; clearOverlay(); colorBuildings(); }
  if (m.type === "edits") { S.edits = m.edits || []; drawEdits(); }
  if (m.type === "layers") for (const [k, on] of Object.entries(m.layers || {}))
    (LAYER_IDS[k] || []).forEach((id) => map.getLayer(id) && map.setLayoutProperty(id, "visibility", on ? "visible" : "none"));
  if (m.type === "pin" && !m.lonlat) { S.marker?.remove(); S.marker = null; }
  if (m.type === "pin" && m.lonlat) {
    S.marker?.remove(); const el = document.createElement("div"); el.className = "pin";
    S.marker = new maplibregl.Marker({ element: el }).setLngLat(m.lonlat).addTo(map);
    map.flyTo({ center: m.lonlat, zoom: 16.2, pitch: 40, duration: 2000, essential: true });
  }
  if (m.type === "terrain") map.setTerrain(m.on ? { source: "dem", exaggeration: m.exaggeration || 4 } : null);
}
